---
- name: Ensure zabbix-agent2 is installed
  ansible.builtin.apt:
    name: zabbix-agent2
    state: present
  register: agent_installed

- name: Configure zabbix-agent2 Server
  ansible.builtin.lineinfile:
    path: "{{ zabbix_agent_conf }}"
    regexp: '^Server='
    line: "Server={{ zabbix_server_ip }}"
  notify: restart zabbix-agent2

- name: Configure zabbix-agent2 ServerActive
  ansible.builtin.lineinfile:
    path: "{{ zabbix_agent_conf }}"
    regexp: '^ServerActive='
    line: "ServerActive={{ zabbix_server_ip }}"
  notify: restart zabbix-agent2

- name: Configure zabbix-agent2 Hostname
  ansible.builtin.lineinfile:
    path: "{{ zabbix_agent_conf }}"
    regexp: '^Hostname='
    line: "Hostname={{ inventory_hostname }}"
  notify: restart zabbix-agent2

- name: Ensure Timeout is set high enough for NFS checks
  ansible.builtin.lineinfile:
    path: "{{ zabbix_agent_conf }}"
    regexp: '^Timeout='
    line: "Timeout=15"
  notify: restart zabbix-agent2

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ zabbix_scripts_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy NFS client monitoring scripts
  ansible.builtin.copy:
    src: "scripts/{{ item }}"
    dest: "{{ zabbix_scripts_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - discover_nfs.sh
    - check_nfs.sh
    - nfs_client_stats.sh
    - nfs_rpc_stats.sh

- name: Deploy NFS client UserParameter config
  ansible.builtin.template:
    src: nfs_monitoring.conf.j2
    dest: "{{ zabbix_agent_confd }}/nfs_monitoring.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart zabbix-agent2

- name: Ensure zabbix-agent2 is enabled and running
  ansible.builtin.systemd:
    name: zabbix-agent2
    enabled: true
    state: started

- name: Verify NFS discovery returns data
  ansible.builtin.command:
    cmd: zabbix_agent2 -t nfs.discovery
  register: nfs_discovery_test
  changed_when: false
  failed_when: false

- name: Show discovery test result
  ansible.builtin.debug:
    msg: "{{ nfs_discovery_test.stdout }}"
