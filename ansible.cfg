[defaults]
inventory = ./inventory/hosts.ini
remote_user = ansible_user
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Optimization
pipelining = True
forks = 10

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
# Note: UserKnownHostsFile=/dev/null is used here for ease of initial testing in dynamic environments 
# BUT for strict security as per agents.md, you should manage known_hosts properly. 
# Changing to strict checking below for production compliance:
# ssh_args = -o ControlMaster=auto -o ControlPersist=60s
