      Private-MAC: 8277c3177dc1463e2b5b26beb32684698155d623
  tasks:
    - name: Wait for Readiness
      wait_for_connection: { timeout: 300 }

    - name: Update System
      block:
        - name: Debian Update
          apt: { update_cache: yes, upgrade: dist }
          when: ansible_os_family == "Debian"
        - name: RedHat Update
          dnf: { name: "*", state: latest }
          when: ansible_os_family == "RedHat"

    - name: Identity Management
      block:
        - name: Set Root Password
          user: { name: root, password: "{{ 'L0cal1t8' | password_hash('sha512') }}" }
        - name: Create yair
          user: { name: yair, password: "{{ 'L0cal1t8' | password_hash('sha512') }}", groups: sudo, append: yes }
        - name: Sudo Permissions
          copy: { content: "yair ALL=(ALL) NOPASSWD: ALL", dest: "/etc/sudoers.d/yair", mode: '0440' }
        - name: SSH Key
          copy: { content: "{{ ppk_content }}", dest: "/root/rsa-key-20250722.ppk", mode: '0600' }
