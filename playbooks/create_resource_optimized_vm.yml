      Private-MAC: 8277c3177dc1463e2b5b26beb32684698155d623

  tasks:
    - name: Identify Best Node (Calculated by each node)
      set_fact:
        best_node: "{{ hostvars | dict2items | selectattr('key', 'in', groups['proxmox_nodes']) | selectattr('value.template_check', 'defined') | selectattr('value.template_check.rc', 'defined') | selectattr('value.template_check.rc', 'equalto', 0) | sort(attribute='value.ansible_facts.memory_mb.real.free', reverse=true) | map(attribute='key') | first | default('') }}"

    - name: Debug Selection Result
      debug:
        msg: "I am '{{ inventory_hostname }}'. The calculated Best Node is '{{ best_node }}'. Memory Free: {{ ansible_facts.memory_mb.real.free }} MB. Template Valid: {{ template_check.rc == 0 }}"

    - name: Fail if no node has the template
      fail:
        msg: "Criteria failed: Template VMID {{ template_vmid }} was not found on ANY Proxmox node. Please check your template ID."
      when: best_node == ""
      run_once: true

    - name: VM Creation Phase
      block:
        - name: Clone VM
          shell: "qm clone {{ template_vmid }} {{ new_vmid }} --name {{ new_vm_name }} --full 1"

        - name: Configure Resources and Keys
          shell: |
            echo "{{ ssh_public_key }}" > /tmp/ssh_key.pub
            qm set {{ new_vmid }} --memory {{ vm_memory }} --cores {{ vm_cores }} --sshkey /tmp/ssh_key.pub --ipconfig0 ip=dhcp

        - name: Start VM
          shell: "qm start {{ new_vmid }}"

        - name: Wait for IP Address
          shell: "qm guest network-get-interfaces {{ new_vmid }} | grep 'ip-address' | grep '192.' | awk '{print $NF}' | head -n 1"
          register: vm_ip_raw
          until: vm_ip_raw.stdout != ""
          retries: 25
          delay: 15

        - name: Export IP
          set_fact:
            new_vm_ip: "{{ vm_ip_raw.stdout | trim }}"
      when: inventory_hostname == best_node

- name: Provisioning Phase
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Fetch VM IP from Node
      set_fact:
        actual_vm_ip: "{{ hostvars[item].new_vm_ip }}"
      when: hostvars[item].new_vm_ip is defined
      loop: "{{ groups['proxmox_nodes'] }}"

    - name: Register VM for provisioning
      add_host:
        name: "{{ actual_vm_ip }}"
        groups: temporarily_created_vms
        ansible_user: root
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      when: actual_vm_ip is defined

- name: Final OS Setup Phase
  hosts: temporarily_created_vms
  gather_facts: yes
  become: yes
  vars:
    ppk_content: |
      PuTTY-User-Key-File-2: ssh-rsa
      Encryption: none
      Comment: rsa-key-20250722
      Public-Lines: 6
      AAAAB3NzaC1yc2EAAAADAQABAAABAQC7UY67tBom83/SwISywjAjnk+moNdst/MZ
      C7g587+aPvrzlQO49IFGPmAp6tiI59KfSX+hoZas/ZtQvsPBCryejQWus13FRuPY
