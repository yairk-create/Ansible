      Wj6U/CUJQZGhEX0nBJvJ5+f0E7fjO0cLBD1yGlyTSsysfKCPgllPpOW+TnG1rLhr
      UAsd1rCxvL6Xd9R1HZMpPOb9LDnYx+u7WgKm6oSq/eCumJzpIW3gQLgR6cyaBKWJ
      Medz+uviNjRFAAAAgQDOSoumtKUREqdsWUqI8DXO0OcxRBVfRnBQPMqy+JuWA16d
      qSuDlJM2jw65ac1pe8ARXCU7VjoOXkORpXxDUUD+tdnrBkdWfTw6JCUTRrEib1ni
      smAKsabBswgWOPLPlgdtZdtbkaFMVId1/v/N14uxQ5IHRWoBkQVOtefa62bldQAA
      AIEAsXJ4Vm8xp+JjsiC6swd3zT4ivRfgMx56uADHsa+CpJzXeixoayoMkw8nifVF
      GZnPG5SErkHDBnvdjGzYwwIeRq7Sg4AWUfCXKNqaFxGOp+oHlzenwtbgH6RjMlRt
      xyddsJXIuIZFpGrwN9wAV4596Ue2lDmO8WKcZ7ZIqGKT01E=
      Private-MAC: 8277c3177dc1463e2b5b26beb32684698155d623

  tasks:
    - name: Find Best Node (Most Free Memory)
      set_fact:
        best_node: "{{ hostvars | dict2items | selectattr('key', 'in', groups['proxmox_nodes']) | selectattr('value.ansible_facts', 'defined') | sort(attribute='value.ansible_facts.memory_mb.real.free', reverse=true) | map(attribute='key') | first }}"

    - name: Report Selected Node
      debug:
        msg: "Selected Node '{{ best_node }}' with {{ hostvars[best_node].ansible_facts.memory_mb.real.free }} MB free memory."

    - name: Clone VM on Best Node
      shell: "PATH=$PATH:/usr/sbin qm clone {{ template_vmid }} {{ new_vmid }} --name {{ new_vm_name }} --full 1"
      delegate_to: "{{ best_node }}"

    - name: Configure VM Resources and SSH Key
      shell: |
        echo "{{ ssh_public_key }}" > /tmp/ssh_key.pub
        PATH=$PATH:/usr/sbin qm set {{ new_vmid }} --memory {{ vm_memory }} --cores {{ vm_cores }} --sshkey /tmp/ssh_key.pub --ipconfig0 ip=dhcp
      delegate_to: "{{ best_node }}"

    - name: Start the New VM
      shell: "PATH=$PATH:/usr/sbin qm start {{ new_vmid }}"
      delegate_to: "{{ best_node }}"

    - name: Wait for VM to Boot and Acquire IP
      shell: "PATH=$PATH:/usr/sbin qm guest network-get-interfaces {{ new_vmid }} | grep 'ip-address' | grep '192.' | awk '{print $NF}' | head -n 1"
      delegate_to: "{{ best_node }}"
      register: vm_ip_raw
      until: vm_ip_raw.stdout != ""
      retries: 25
      delay: 15
      ignore_errors: yes

    - name: Set VM IP
      set_fact:
        new_vm_ip: "{{ vm_ip_raw.stdout | trim }}"
      when: vm_ip_raw.stdout != ""

    - name: Alert if IP not found
      fail:
        msg: "VM started but could not retrieve IP. Please check Proxmox console."
      when: new_vm_ip is not defined or new_vm_ip == ""

- name: Provision the New VM
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Add New VM to Temporary Inventory
      add_host:
        name: "{{ new_vm_ip }}"
        groups: temporarily_created_vms
        ansible_user: root
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

- name: Update and Inject Key inside the VM
  hosts: temporarily_created_vms
  gather_facts: yes
  become: yes
  tasks:
    - name: Wait for SSH to be fully ready
      wait_for_connection:
        timeout: 300

    - name: Update System
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == 'Debian'

    - name: Set root password
      user:
        name: root
        password: "{{ 'L0cal1t8' | password_hash('sha512') }}"

    - name: Create 'yair' user with sudo access
      user:
        name: yair
        password: "{{ 'L0cal1t8' | password_hash('sha512') }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present

    - name: Place Private PPK Key
      copy:
        content: "{{ hostvars['localhost'].ppk_content }}"
        dest: "/root/rsa-key-20250722.ppk"
        mode: '0600'
