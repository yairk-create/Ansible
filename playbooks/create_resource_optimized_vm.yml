---
# ==========================================
# PHASE 1: GATHER METRICS & LOCATE TEMPLATE
# ==========================================
- name: Cluster Reconnaissance
  hosts: proxmox_nodes
  gather_facts: yes
  tasks:
    - name: Search for Template ID 500
      shell: "qm status 500"
      register: template_check
      failed_when: false
      changed_when: false

# ==========================================
# PHASE 2: SELECTION & USER INPUT
# ==========================================
- name: Decision Logic and Resource Allocation
  hosts: localhost
  connection: local
  gather_facts: no
  vars_prompt:
    - name: new_vm_name
      prompt: "Enter the name for the new VM"
      default: "auto-vm"
      private: no
    - name: vm_memory
      prompt: "Enter RAM in MB"
      default: "2048"
      private: no
    - name: vm_cores
      prompt: "Enter number of CPU cores"
      default: "2"
      private: no

  tasks:
    - name: Calculate Best Resource Node
      set_fact:
        best_node: "{{ hostvars | dict2items | selectattr('key', 'in', groups['proxmox_nodes']) | selectattr('value.template_check', 'defined') | selectattr('value.template_check.rc', 'defined') | selectattr('value.template_check.rc', 'equalto', 0) | sort(attribute='value.ansible_facts.memory_mb.real.free', reverse=true) | map(attribute='key') | first | default('') }}"

    - name: Validation
      fail:
        msg: "CRITICAL ERROR: No Proxmox node found that has Template ID 500. Please ensure the template exists on at least one node."
      when: best_node == ""

    - name: Report Selection
      debug:
        msg: "Selected Node: '{{ best_node }}' (Highest free RAM with Template 500)"

# ==========================================
# PHASE 3: EXECUTE CLONE ON SELECTED NODE
# ==========================================
- name: Create VM on {{ hostvars['localhost'].best_node }}
  hosts: "{{ hostvars['localhost'].best_node }}"
  gather_facts: no
  vars:
    new_vmid: "{{ 9999 | random(start=1000) }}"
    ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC7UY67tBom83/SwISywjAjnk+moNdst/MZC7g587+aPvrzlQO49IFGPmAp6tiI59KfSX+hoZas/ZtQvsPBCryejQWus13FRuPYEMal21pnk4k/PvqI/uB8cqcyWUSwMk0JgS2Szg3K8NQgnx0Rs6ATSt= rsa-key-20250722"

  tasks:
    - name: Build VM
      block:
        - name: Clone from Template
          shell: "qm clone 500 {{ new_vmid }} --name {{ hostvars['localhost'].new_vm_name }} --full 1"

        - name: Configure Resources and SSH Key
          shell: |
            echo "{{ ssh_public_key }}" > /tmp/ssh_key.pub
            qm set {{ new_vmid }} --memory {{ hostvars['localhost'].vm_memory }} --cores {{ hostvars['localhost'].vm_cores }} --sshkey /tmp/ssh_key.pub --ipconfig0 ip=dhcp

        - name: Start the VM
          shell: "qm start {{ new_vmid }}"

        - name: Wait for Network Availability
          shell: "qm guest network-get-interfaces {{ new_vmid }} | grep 'ip-address' | grep '192.' | awk '{print $NF}' | head -n 1"
          register: vm_ip_raw
          until: vm_ip_raw.stdout != ""
          retries: 30
          delay: 10

        - name: Save Metadata
          set_fact:
            provisioning_ip: "{{ vm_ip_raw.stdout | trim }}"

# ==========================================
# PHASE 4: FINAL GUEST PROVISIONING
# ==========================================
- name: Guest OS Preparation
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Register VM in Inventory
      add_host:
        name: "{{ hostvars[hostvars['localhost'].best_node].provisioning_ip }}"
        groups: temporarily_spawned
        ansible_user: root
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

- name: Final Configuration (Users & OS)
  hosts: temporarily_spawned
  gather_facts: yes
  become: yes
  vars:
    ppk_content: |
      PuTTY-User-Key-File-2: ssh-rsa
      Encryption: none
      Comment: rsa-key-20250722
      Public-Lines: 6
      AAAAB3NzaC1yc2EAAAADAQABAAABAQC7UY67tBom83/SwISywjAjnk+moNdst/MZ
