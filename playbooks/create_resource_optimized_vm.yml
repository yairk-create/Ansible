- name: Gather Facts and Verify Template on Proxmox Nodes
  hosts: proxmox_nodes
  gather_facts: yes
  vars:
    template_vmid: 500
  tasks:
    - name: Check if Template VMID {{ template_vmid }} exists on node
      shell: "qm status {{ template_vmid }}"
      register: template_check
      ignore_errors: yes
      changed_when: false

- name: Create VM on Best Resource Node
  hosts: proxmox_nodes
  gather_facts: no
  vars_prompt:
    - name: new_vm_name
      prompt: "Enter the name for the new VM"
      default: "auto-vm"
      private: no
    - name: vm_memory
      prompt: "Enter RAM in MB"
      default: "2048"
      private: no
    - name: vm_cores
      prompt: "Enter number of CPU cores"
      default: "2"
      private: no

  vars:
    template_vmid: 500
    new_vmid: "{{ 9999 | random(start=1000) }}"
    ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC7UY67tBom83/SwISywjAjnk+moNdst/MZC7g587+aPvrzlQO49IFGPmAp6tiI59KfSX+hoZas/ZtQvsPBCryejQWus13FRuPYEMal21pnk4k/PvqI/uB8cqcyWUSwMk0JgS2Szg3K8NQgnx0Rs6ATSt= rsa-key-20250722"
    ppk_content: |
      PuTTY-User-Key-File-2: ssh-rsa
      Encryption: none
      Comment: rsa-key-20250722
      Public-Lines: 6
      AAAAB3NzaC1yc2EAAAADAQABAAABAQC7UY67tBom83/SwISywjAjnk+moNdst/MZ
      C7g587+aPvrzlQO49IFGPmAp6tiI59KfSX+hoZas/ZtQvsPBCryejQWus13FRuPY
