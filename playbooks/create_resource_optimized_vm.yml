---
- name: Gather Facts from Proxmox Nodes
  hosts: proxmox_nodes
  gather_facts: yes

- name: Determine Best Proxmox Node and Create VM
  hosts: localhost
  connection: local
  gather_facts: no
  vars_prompt:
    - name: new_vm_name
      prompt: "Enter the name for the new VM"
      default: "auto-vm"
      private: no
    - name: vm_memory
      prompt: "Enter RAM in MB"
      default: "2048"
      private: no
    - name: vm_cores
      prompt: "Enter number of CPU cores"
      default: "2"
      private: no

  vars:
    template_vmid: 500  # Default template ID found on your cluster
    new_vmid: "{{ 9999 | random(start=1000) }}" 
    ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC7UY67tBom83/SwISywjAjnk+moNdst/MZC7g587+aPvrzlQO49IFGPmAp6tiI59KfSX+hoZas/ZtQvsPBCryejQWus13FRuPYEMal21pnk4k/PvqI/uB8cqcyWUSwMk0JgS2Szg3K8NQgnx0Rs6ATSt= rsa-key-20250722"
    ppk_content: |
      PuTTY-User-Key-File-2: ssh-rsa
      Encryption: none
      Comment: rsa-key-20250722
      Public-Lines: 6
      AAAAB3NzaC1yc2EAAAADAQABAAABAQC7UY67tBom83/SwISywjAjnk+moNdst/MZ
      C7g587+aPvrzlQO49IFGPmAp6tiI59KfSX+hoZas/ZtQvsPBCryejQWus13FRuPY
      EMal21pnk4k/PvqI/uB8cqcyWUSwMk0JgS2Szg3K8NQgnx0Rs6ATStvObxagPW3K
      AXP89YK9DsvsZ93E6lEvAejtQAbhEWn+iaLOR4HwdBBhIMR2411IZk0s7SxCmLIm
      pJnfy8qpkxlb2wvU1HHa7I/bgISpqlAKRpABiQLBqlFbI90MexJx9e3hxO6Vz+Vc
      kOm8q2lLoOZO4kS0F/Ly49wqmNDTrcvzcL5umYwb/JA2WH8KBZyJ
      Private-Lines: 14
      AAABAAu3+nn7tnchXKnOqX6Vb3WK/eiqv09p4qd6eDgH68C2l/SNKgJ0KXI/jLyS
      mKFX/3E/o+B0v3xrEUBn7s8w4MP6hpR7XC5vVOm7gvH1Wx6HuFpgkkPnzht7AMLB
      mu569x7VGgjJI0vC7UJtMeBdoHIUiNPNV1kG/stYc+0rXtZ87wo5AZDYzjiRiqSl
      thxgN3YwoIhbkbo9XIGfWo+np8tuJ5Bts1TCFO5xwiAMXKI41asuQn5CKGk1nVZB
      YkbKIwDtOr/rpaW7n34jaA49FQ5i4ZmdxIstJE6ULHjpPbkeJ0PTiuV+hMOPOBQU
