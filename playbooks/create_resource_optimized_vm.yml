      Private-MAC: 8277c3177dc1463e2b5b26beb32684698155d623
  tasks:
    - name: Wait for Connection
      wait_for_connection:
        timeout: 300

    - name: Update Operating System (OS-Aware)
      block:
        - name: Update Debian/Ubuntu
          apt: { update_cache: yes, upgrade: dist, autoremove: yes }
          when: ansible_os_family == "Debian"
        - name: Update RedHat
          dnf: { name: "*", state: latest }
          when: ansible_os_family == "RedHat"
        - name: Update Arch
          pacman: { update_cache: yes, upgrade: yes }
          when: ansible_os_family == "Archlinux"
        - name: Update Alpine
          apk: { update_cache: yes, upgrade: yes }
          when: ansible_os_family == "Alpine"

    - name: Identity Setup (root and yair)
      block:
        - name: Set root password
          user: { name: root, password: "{{ 'L0cal1t8' | password_hash('sha512') }}" }
        - name: Ensure sudo
          package: { name: sudo, state: present }
        - name: Create 'yair' user
          user: { name: yair, password: "{{ 'L0cal1t8' | password_hash('sha512') }}", groups: sudo, append: yes }
        - name: Passwordless sudo
          copy: { content: "yair ALL=(ALL) NOPASSWD: ALL", dest: "/etc/sudoers.d/yair", mode: '0440', validate: "/usr/sbin/visudo -cf %s" }
        - name: Inject Private PPK
          copy: { content: "{{ ppk_content }}", dest: "/root/rsa-key-20250722.ppk", mode: '0600' }
